name: Verify scanner boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test runtime and auditor
      run: python -m pip install -r requirements-dev.txt pip-audit==2.10.1
    - name: Unit and adversarial tests
      run: python -m unittest discover -s tests -v
    - name: Real mutual TLS and persistent quota integration (provider stub)
      run: python tools/verify_team_local.py
    - name: Audit locked runtime graphs
      run: |
        for lock in dependencies/*.lock; do
          python -m pip_audit --strict --disable-pip --no-deps -r "$lock"
        done
    - name: Build production-shaped images
      run: |
        for image in agent scanner gateway proxy identity; do
          docker build -f "docker/Dockerfile.$image" -t "codescan-$image:verify" .
        done
    - name: Verify source formatting
      run: |
        git diff --check
        bash -n run-scan.sh scan-job.sh
    - name: Verify native engine on vulnerable sample
      run: |
        docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp \
          -v "$PWD/dast/target:/target:ro" -v "$PWD/tools/verify_native_image.py:/verify_native_image.py:ro" \
          --entrypoint python codescan-scanner:verify /verify_native_image.py
