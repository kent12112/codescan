apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: scanner
spec:
  replicas: 1
  selector:
    matchLabels: { app: egress-proxy }
  template:
    metadata:
      labels: { app: egress-proxy }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: proxy
        image: docker.io/library/codescan-proxy:latest
        imagePullPolicy: Never
        ports: [{ containerPort: 8080 }]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: scanner
spec:
  selector: { app: egress-proxy }
  ports: [{ port: 8080, targetPort: 8080 }]
