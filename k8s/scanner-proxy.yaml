apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-proxy
  namespace: scanner
spec:
  replicas: 1
  selector:
    matchLabels: { app: scanner-proxy }
  template:
    metadata:
      labels: { app: scanner-proxy }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      # Allowlist CONNECT proxy (egress/proxy.py) that lets the scanner Job clone
      # from github.com only. It reuses the gateway image, which ships proxy.py;
      # `command` replaces that image's gunicorn ENTRYPOINT so only the proxy runs.
      # It deliberately does NOT use the scanner image (no semgrep/git/pipeline here).
      - name: proxy
        image: docker.io/library/codescan-gateway:team-v1
        imagePullPolicy: IfNotPresent
        command: [python, /app/proxy.py]
        env:
        - name: EGRESS_HOSTS
          value: github.com
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          tcpSocket: { port: 8080 }
          periodSeconds: 2
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 250m, memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-proxy
  namespace: scanner
spec:
  selector: { app: scanner-proxy }
  ports: [{ port: 8080, targetPort: 8080 }]
