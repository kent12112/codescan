apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-proxy
  namespace: scanner
spec:
  replicas: 1
  selector:
    matchLabels: { app: scanner-proxy }
  template:
    metadata:
      labels: { app: scanner-proxy }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: proxy
        image: docker.io/library/codescan-scanner:hardened-v1
        imagePullPolicy: IfNotPresent
        command: [python, /home/scanner/proxy.py]
        env:
        - name: EGRESS_HOSTS
          value: api.anthropic.com,github.com
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          tcpSocket: { port: 8080 }
          periodSeconds: 2
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 250m, memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-proxy
  namespace: scanner
spec:
  selector: { app: scanner-proxy }
  ports: [{ port: 8080, targetPort: 8080 }]
