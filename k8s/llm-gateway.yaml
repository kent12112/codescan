apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gateway-state, namespace: scanner }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: llm-gateway, namespace: scanner }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: gateway
        image: docker.io/library/codescan-gateway:team-v1
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8443 }]
        env:
        - { name: DAILY_REQUEST_LIMIT, value: '200' }
        - { name: MINUTE_REQUEST_LIMIT, value: '30' }
        - { name: LLM_UPSTREAM_PROXY, value: 'http://llm-egress-proxy:8080' }
        readinessProbe:
          tcpSocket: { port: 8443 }
          periodSeconds: 3
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 500m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: state, mountPath: /state }
        - { name: identity, mountPath: /etc/workload-tls, readOnly: true }
        - { name: provider, mountPath: /etc/provider-key, readOnly: true }
      volumes:
      - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
      - { name: state, persistentVolumeClaim: { claimName: gateway-state } }
      - name: identity
        secret: { secretName: llm-gateway-tls, defaultMode: 288 }
      - name: provider
        secret:
          secretName: anthropic
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata: { name: llm-gateway, namespace: scanner }
spec:
  selector: { app: llm-gateway }
  ports: [{ port: 8443, targetPort: 8443 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: llm-egress-proxy, namespace: scanner }
spec:
  replicas: 1
  selector:
    matchLabels: { app: llm-egress-proxy }
  template:
    metadata:
      labels: { app: llm-egress-proxy }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: proxy
        image: docker.io/library/codescan-gateway:team-v1
        imagePullPolicy: IfNotPresent
        command: [python, /app/proxy.py]
        env:
        - { name: EGRESS_HOSTS, value: api.anthropic.com }
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          tcpSocket: { port: 8080 }
          periodSeconds: 3
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 250m, memory: 96Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: llm-egress-proxy, namespace: scanner }
spec:
  selector: { app: llm-egress-proxy }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-boundary, namespace: scanner }
spec:
  podSelector:
    matchLabels: { app: llm-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: cve-agent } }
    - podSelector: { matchLabels: { app: codescan-scanner } }
    ports: [{ protocol: TCP, port: 8443 }]
  egress:
  - to:
    - podSelector: { matchLabels: { app: llm-egress-proxy } }
    ports: [{ protocol: TCP, port: 8080 }]
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
    ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: llm-proxy-ingress, namespace: scanner }
spec:
  podSelector:
    matchLabels: { app: llm-egress-proxy }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: llm-gateway } }
    ports: [{ protocol: TCP, port: 8080 }]
