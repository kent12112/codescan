apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: codescan-report-reader, namespace: scanner }
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
