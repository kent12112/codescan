apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-isolation
  namespace: scanner
spec:
  podSelector:
    matchLabels: { app: codescan-scanner }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - podSelector: { matchLabels: { app: cve-agent } }
    ports: [{ protocol: TCP, port: 9000 }]
  - to:
    - podSelector: { matchLabels: { app: llm-gateway } }
    ports: [{ protocol: TCP, port: 8443 }]
  - to:
    - podSelector: { matchLabels: { app: scanner-proxy } }
    ports: [{ protocol: TCP, port: 8080 }]
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector:
        matchLabels: { k8s-app: kube-dns }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-proxy-ingress
  namespace: scanner
spec:
  podSelector:
    matchLabels: { app: scanner-proxy }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: codescan-scanner } }
    ports: [{ protocol: TCP, port: 8080 }]
