apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: scanner
spec:
  podSelector:
    matchLabels: { app: cve-agent }
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: { matchLabels: { app: egress-proxy } }
    ports: [{ protocol: TCP, port: 8080 }]
  - to:
    - namespaceSelector: {}
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
